<!doctype html>
<html lang="zh-CN" data-theme="celadon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的工作台</title>
<!-- 字体：默认只用系统字体。需要网络字体时在这里加 <link>，见 references/themes.md 第 3 节 -->
<style>
/*
 * 工作台主题库
 * 用法：<html data-theme="celadon">，可选 data-mode="light" | "dark"（不写则跟随系统）
 * 组件里只用下面的变量，不写裸色值。各主题的说明见 references/themes.md
 * 配色变量结构参考 ui-ux-pro-max（MIT），主题为本 skill 原创。
 */

/* ---------- 字体栈：系统字体优先，网络字体可选（见 themes.md 第 3 节） ---------- */
:root {
  --font-hei:  "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei UI", "Microsoft YaHei",
               "Noto Sans SC", "Noto Sans CJK SC", "Source Han Sans SC", system-ui, sans-serif;
  --font-song: "Noto Serif SC", "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --font-kai:  "LXGW WenKai Screen", "LXGW WenKai", "Kaiti SC", "STKaiti", "KaiTi", serif;
  --font-mono: "SF Mono", "JetBrains Mono", "Cascadia Mono", "Consolas", "Menlo", monospace;

  /* 字号阶梯（整页最多用 5 级） */
  --text-xs: 0.75rem;   /* 12 */
  --text-sm: 0.875rem;  /* 14 */
  --text-md: 1rem;      /* 16 正文 */
  --text-lg: 1.25rem;   /* 20 */
  --text-xl: 1.625rem;  /* 26 */
  --text-2xl: 2.25rem;  /* 36 */
  --text-3xl: 3rem;     /* 48 仅用于主题的标志性大字 */
  --leading-body: 1.7;
  --leading-tight: 1.3;

  /* 间距（乘以主题密度） */
  --density: 1;
  --space-1: calc(4px * var(--density));
  --space-2: calc(8px * var(--density));
  --space-3: calc(12px * var(--density));
  --space-4: calc(16px * var(--density));
  --space-5: calc(24px * var(--density));
  --space-6: calc(32px * var(--density));
  --space-7: calc(48px * var(--density));
  --gutter: 16px; /* 手机左右边距，不随密度变化 */

  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --dur: 200ms;
  --icon-size: 20px;
  --icon-stroke: 1.75;
}

/* ---------- 标签色默认值（项目线路色、家庭成员色），各主题可覆盖 ---------- */
html {
  --line-1: #C2410C; --line-2: #1864AB; --line-3: #2A7E3A; --line-4: #A61E4D; --line-5: #5F3DC4; --line-6: #0B7285;
  --member-1: #C2410C; --member-2: #1864AB; --member-3: #2A7E3A; --member-4: #A61E4D; --member-5: #5F3DC4; --member-6: #0B7285;
}
html[data-mode="dark"] {
  --line-1: #FF9F6E; --line-2: #74B3F0; --line-3: #74C98E; --line-4: #F088AC; --line-5: #B39DF5; --line-6: #5CC9D6;
  --member-1: #FF9F6E; --member-2: #74B3F0; --member-3: #74C98E; --member-4: #F088AC; --member-5: #B39DF5; --member-6: #5CC9D6;
}
@media (prefers-color-scheme: dark) {
  html:not([data-mode="light"]) {
    --line-1: #FF9F6E; --line-2: #74B3F0; --line-3: #74C98E; --line-4: #F088AC; --line-5: #B39DF5; --line-6: #5CC9D6;
    --member-1: #FF9F6E; --member-2: #74B3F0; --member-3: #74C98E; --member-4: #F088AC; --member-5: #B39DF5; --member-6: #5CC9D6;
  }
}

/* ============================================================
 * 1. 青瓷 celadon：安静、以文字为主（写作、教师、研究、学生）
 *    标志细节：今日日期用宋体大字，旁边一枚朱砂小印“今”
 * ============================================================ */
html[data-theme="celadon"] {
  --font-display: var(--font-song);
  --font-body: var(--font-hei);
  --radius-sm: 4px; --radius-md: 6px; --radius-lg: 10px;
  --density: 1.1;
  --bg: #EDF1EE; --surface: #F8FAF8; --surface-2: #E1E9E4;
  --fg: #1E2925; --fg-muted: #4A5953; --fg-subtle: #5F6D67;
  --border: #CAD5CF; --border-strong: #7D948A;
  --primary: #2C6655; --on-primary: #FFFFFF; --primary-soft: #D3E5DC;
  --accent: #A8352A; --on-accent: #FFFFFF;
  --success: #2F7A4B; --warning: #8A5A00; --danger: #B3261E;
  --ring: #2C6655; --selection: #CFE3D8;
  --shadow: 0 1px 2px rgba(30, 41, 37, 0.06), 0 4px 12px rgba(30, 41, 37, 0.05);
}
html[data-theme="celadon"][data-mode="dark"] {
  --bg: #131A18; --surface: #1A2320; --surface-2: #22302B;
  --fg: #E1E8E4; --fg-muted: #A7B5AE; --fg-subtle: #8F9E97;
  --border: #2E3C37; --border-strong: #5B7169;
  --primary: #7DBDA7; --on-primary: #0C1714; --primary-soft: #23413A;
  --accent: #E58376; --on-accent: #1A0F0D;
  --success: #74C493; --warning: #E0B45C; --danger: #F28B82;
  --ring: #7DBDA7; --selection: #2B4A41;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 16px rgba(0, 0, 0, 0.25);
}

/* ============================================================
 * 2. 导视 wayfinding：多线并行、一眼识别（项目经理、运营、自由职业多客户）
 *    标志细节：每个项目一种“线路色”，项目名前一枚线路标
 * ============================================================ */
html[data-theme="wayfinding"] {
  --font-display: var(--font-hei);
  --font-body: var(--font-hei);
  --display-weight: 800;
  --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px;
  --density: 1;
  --bg: #F4F5F7; --surface: #FFFFFF; --surface-2: #E9ECEF;
  --fg: #14181D; --fg-muted: #474F59; --fg-subtle: #5B636D;
  --border: #D7DCE1; --border-strong: #8893A0;
  --primary: #0050AA; --on-primary: #FFFFFF; --primary-soft: #DCE8F7;
  --accent: #F2B705; --on-accent: #14181D;
  --success: #00804F; --warning: #9A5B00; --danger: #C8102E;
  --ring: #0050AA; --selection: #CFE0F5;
  --line-1: #C8102E; --line-2: #0050AA; --line-3: #00804F;
  --line-4: #B35A00; --line-5: #6B3FA0; --line-6: #00838F;
  --shadow: 0 1px 2px rgba(20, 24, 29, 0.08);
}
html[data-theme="wayfinding"][data-mode="dark"] {
  --bg: #0F1317; --surface: #171C21; --surface-2: #20262D;
  --fg: #E8ECF0; --fg-muted: #A4AEB8; --fg-subtle: #8B96A1;
  --border: #29313A; --border-strong: #5B6979;
  --primary: #5AA2FF; --on-primary: #071425; --primary-soft: #16304F;
  --accent: #F2B705; --on-accent: #14181D;
  --success: #3CC48A; --warning: #F0A93B; --danger: #FF6B7D;
  --ring: #5AA2FF; --selection: #1D3A5E;
  --line-1: #FF6B7D; --line-2: #5AA2FF; --line-3: #3CC48A;
  --line-4: #FF9F43; --line-5: #B48CF0; --line-6: #3CC7D3;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
}

/* ============================================================
 * 3. 对账 ledger：数字多、要对得齐（财务、销售、电商、记账）
 *    标志细节：数字一律等宽右对齐带千分位，负数用“红字”
 * ============================================================ */
html[data-theme="ledger"] {
  --font-display: var(--font-hei);
  --font-body: var(--font-hei);
  --font-num: var(--font-mono);
  --display-weight: 600;
  --radius-sm: 2px; --radius-md: 4px; --radius-lg: 6px;
  --density: 0.85;
  --bg: #F1F3F1; --surface: #FFFFFF; --surface-2: #E7EAE7;
  --fg: #191C1A; --fg-muted: #4C534F; --fg-subtle: #5E6561;
  --border: #D2D7D3; --border-strong: #8C9690;
  --primary: #1C5A42; --on-primary: #FFFFFF; --primary-soft: #D7E8DF;
  --accent: #1C5A42; --on-accent: #FFFFFF;
  --success: #1C5A42; --warning: #8F5B00; --danger: #B42318;
  --negative: #B42318; --positive: #191C1A;
  --ring: #1C5A42; --selection: #D7E8DF;
  --shadow: none;
}
html[data-theme="ledger"][data-mode="dark"] {
  --bg: #111412; --surface: #181C19; --surface-2: #202521;
  --fg: #E3E7E4; --fg-muted: #A1AAA5; --fg-subtle: #89938D;
  --border: #2A302C; --border-strong: #5E6B63;
  --primary: #6DBE96; --on-primary: #08150F; --primary-soft: #1D3A2D;
  --accent: #6DBE96; --on-accent: #08150F;
  --success: #6DBE96; --warning: #E3B04B; --danger: #F27D72;
  --negative: #F27D72; --positive: #E3E7E4;
  --ring: #6DBE96; --selection: #244536;
  --shadow: none;
}

/* ============================================================
 * 4. 夜读 nightdesk：深色优先、低刺激（程序员、设计师、夜间工作者、学生）
 *    标志细节：专注模式，选中一条待办后其余区域整体调暗，只留它和计时
 * ============================================================ */
html[data-theme="nightdesk"] {
  --font-display: var(--font-hei);
  --font-body: var(--font-hei);
  --display-weight: 600;
  --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px;
  --density: 1;
  --bg: #EFF0F3; --surface: #FFFFFF; --surface-2: #E4E6EB;
  --fg: #1A1E26; --fg-muted: #4D5466; --fg-subtle: #5D6476;
  --border: #D5D8E0; --border-strong: #8A92A5;
  --primary: #2D5884; --on-primary: #FFFFFF; --primary-soft: #DCE6F1;
  --accent: #8C5E0B; --on-accent: #FFFFFF;
  --success: #2E7D4F; --warning: #8C5E0B; --danger: #B3261E;
  --ring: #2D5884; --selection: #D3E0EE;
  --shadow: 0 1px 2px rgba(26, 30, 38, 0.06), 0 4px 14px rgba(26, 30, 38, 0.06);
  --dim: rgba(239, 240, 243, 0.72);
}
html[data-theme="nightdesk"][data-mode="dark"] {
  --bg: #16191F; --surface: #1D2129; --surface-2: #252A34;
  --fg: #E6E3DB; --fg-muted: #A8ACB7; --fg-subtle: #9095A1;
  --border: #303644; --border-strong: #626C83;
  --primary: #8DB3D8; --on-primary: #0E141C; --primary-soft: #23324A;
  --accent: #E2B465; --on-accent: #1B1408;
  --success: #82C49A; --warning: #E2B465; --danger: #F08A80;
  --ring: #8DB3D8; --selection: #2C3D57;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 8px 20px rgba(0, 0, 0, 0.3);
  --dim: rgba(22, 25, 31, 0.78);
}

/* ============================================================
 * 5. 庭院 courtyard：生活和家庭（宝妈宝爸、家庭事务、个人生活管理）
 *    标志细节：每个家庭成员一种颜色，日程和家务按人着色，头像是名字首字
 * ============================================================ */
html[data-theme="courtyard"] {
  --font-display: var(--font-kai);
  --font-body: var(--font-hei);
  --display-weight: 700;
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 18px;
  --density: 1.05;
  --bg: #F1F5F8; --surface: #FFFFFF; --surface-2: #E5ECF1;
  --fg: #1C2631; --fg-muted: #4A5766; --fg-subtle: #5A6776;
  --border: #D4DDE5; --border-strong: #8294A7;
  --primary: #B8410C; --on-primary: #FFFFFF; --primary-soft: #FBE3D6;
  --accent: #2F7D4A; --on-accent: #FFFFFF;
  --success: #2F7D4A; --warning: #8F5D00; --danger: #B3261E;
  --ring: #B8410C; --selection: #FBE3D6;
  --member-1: #C2410C; --member-2: #1864AB; --member-3: #2A7E3A;
  --member-4: #A61E4D; --member-5: #5F3DC4; --member-6: #0B7285;
  --shadow: 0 2px 6px rgba(28, 38, 49, 0.06), 0 10px 24px rgba(28, 38, 49, 0.05);
}
html[data-theme="courtyard"][data-mode="dark"] {
  --bg: #141A20; --surface: #1B232B; --surface-2: #242E38;
  --fg: #E7ECF0; --fg-muted: #A9B5C1; --fg-subtle: #919EAB;
  --border: #2D3843; --border-strong: #5D6F81;
  --primary: #FF9F6E; --on-primary: #2A1205; --primary-soft: #4A2716;
  --accent: #74C98E; --on-accent: #0B1A10;
  --success: #74C98E; --warning: #EDB65A; --danger: #F28B82;
  --ring: #FF9F6E; --selection: #4A2E20;
  --member-1: #FF9F6E; --member-2: #74B3F0; --member-3: #74C98E;
  --member-4: #F088AC; --member-5: #B39DF5; --member-6: #5CC9D6;
  --shadow: 0 2px 6px rgba(0, 0, 0, 0.35), 0 10px 24px rgba(0, 0, 0, 0.3);
}

/* ============================================================
 * 6. 画室 studio：留白多、只有一处大胆（设计师、内容创作者、自媒体）
 *    标志细节：首屏一句超大字号的“今天最重要的一件事”，用克莱因蓝
 * ============================================================ */
html[data-theme="studio"] {
  --font-display: var(--font-hei);
  --font-body: var(--font-hei);
  --display-weight: 900;
  --radius-sm: 0px; --radius-md: 2px; --radius-lg: 4px;
  --density: 1.2;
  --bg: #FAFAF9; --surface: #FFFFFF; --surface-2: #F0F0EE;
  --fg: #16181D; --fg-muted: #50555F; --fg-subtle: #60656F;
  --border: #E1E2E5; --border-strong: #8E939D;
  --primary: #002FA7; --on-primary: #FFFFFF; --primary-soft: #DFE6F8;
  --accent: #FFC93C; --on-accent: #16181D;
  --success: #1E7A46; --warning: #8F5D00; --danger: #C0262D;
  --ring: #002FA7; --selection: #FFE9A8;
  --shadow: none;
}
html[data-theme="studio"][data-mode="dark"] {
  --bg: #0E1322; --surface: #151B2E; --surface-2: #1D2540;
  --fg: #EDEEF2; --fg-muted: #A8AEC0; --fg-subtle: #9097AB;
  --border: #262F4D; --border-strong: #57669A;
  --primary: #93A9FF; --on-primary: #0A1030; --primary-soft: #222E5C;
  --accent: #FFC93C; --on-accent: #16181D;
  --success: #6CCB93; --warning: #FFC93C; --danger: #FF8A8F;
  --ring: #93A9FF; --selection: #3A3410;
  --shadow: none;
}

/* ---------- 跟随系统深色（data-mode 未指定时） ---------- */
@media (prefers-color-scheme: dark) {
  html[data-theme="celadon"]:not([data-mode="light"]) {
    --bg: #131A18; --surface: #1A2320; --surface-2: #22302B;
    --fg: #E1E8E4; --fg-muted: #A7B5AE; --fg-subtle: #8F9E97;
    --border: #2E3C37; --border-strong: #5B7169;
    --primary: #7DBDA7; --on-primary: #0C1714; --primary-soft: #23413A;
    --accent: #E58376; --on-accent: #1A0F0D;
    --success: #74C493; --warning: #E0B45C; --danger: #F28B82;
    --ring: #7DBDA7; --selection: #2B4A41;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 16px rgba(0, 0, 0, 0.25);
  }

    --bg: #0F1317; --surface: #171C21; --surface-2: #20262D;
    --fg: #E8ECF0; --fg-muted: #A4AEB8; --fg-subtle: #8B96A1;
    --border: #29313A; --border-strong: #5B6979;
    --primary: #5AA2FF; --on-primary: #071425; --primary-soft: #16304F;
    --accent: #F2B705; --on-accent: #14181D;
    --success: #3CC48A; --warning: #F0A93B; --danger: #FF6B7D;
    --ring: #5AA2FF; --selection: #1D3A5E;
    --line-1: #FF6B7D; --line-2: #5AA2FF; --line-3: #3CC48A;
    --line-4: #FF9F43; --line-5: #B48CF0; --line-6: #3CC7D3;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  }
  html[data-theme="ledger"]:not([data-mode="light"]) {
    --bg: #111412; --surface: #181C19; --surface-2: #202521;
    --fg: #E3E7E4; --fg-muted: #A1AAA5; --fg-subtle: #89938D;
    --border: #2A302C; --border-strong: #5E6B63;
    --primary: #6DBE96; --on-primary: #08150F; --primary-soft: #1D3A2D;
    --accent: #6DBE96; --on-accent: #08150F;
    --success: #6DBE96; --warning: #E3B04B; --danger: #F27D72;
    --negative: #F27D72; --positive: #E3E7E4;

  }
  html[data-theme="nightdesk"]:not([data-mode="light"]) {
    --bg: #16191F; --surface: #1D2129; --surface-2: #252A34;
    --fg: #E6E3DB; --fg-muted: #A8ACB7; --fg-subtle: #9095A1;
    --border: #303644; --border-strong: #626C83;
    --primary: #8DB3D8; --on-primary: #0E141C; --primary-soft: #23324A;
    --accent: #E2B465; --on-accent: #1B1408;
    --success: #82C49A; --warning: #E2B465; --danger: #F08A80;
    --ring: #8DB3D8; --selection: #2C3D57;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 8px 20px rgba(0, 0, 0, 0.3);
    --dim: rgba(22, 25, 31, 0.78);
  }
  html[data-theme="courtyard"]:not([data-mode="light"]) {
    --bg: #141A20; --surface: #1B232B; --surface-2: #242E38;
    --fg: #E7ECF0; --fg-muted: #A9B5C1; --fg-subtle: #919EAB;
    --border: #2D3843; --border-strong: #5D6F81;
    --primary: #FF9F6E; --on-primary: #2A1205; --primary-soft: #4A2716;
    --accent: #74C98E; --on-accent: #0B1A10;
    --success: #74C98E; --warning: #EDB65A; --danger: #F28B82;
    --ring: #FF9F6E; --selection: #4A2E20;
    --member-1: #FF9F6E; --member-2: #74B3F0; --member-3: #74C98E;
    --member-4: #F088AC; --member-5: #B39DF5; --member-6: #5CC9D6;
    --shadow: 0 2px 6px rgba(0, 0, 0, 0.35), 0 10px 24px rgba(0, 0, 0, 0.3);
  }
  html[data-theme="studio"]:not([data-mode="light"]) {
    --bg: #0E1322; --surface: #151B2E; --surface-2: #1D2540;
    --fg: #EDEEF2; --fg-muted: #A8AEC0; --fg-subtle: #9097AB;
    --border: #262F4D; --border-strong: #57669A;
    --primary: #93A9FF; --on-primary: #0A1030; --primary-soft: #222E5C;
    --accent: #FFC93C; --on-accent: #16181D;
    --success: #6CCB93; --warning: #FFC93C; --danger: #FF8A8F;

  }
}

/* ============================================================
 * 以下 5 套是“行业主题”，各配一个立体主视觉（见 references/themes.md 第 2 节）
 * ============================================================ */

/* 7. 晒图 blueprint：建筑、室内、工程、产品设计
 *    主视觉：等轴测楼体，一层一个阶段 */
html[data-theme="blueprint"] {
  --font-display: var(--font-hei);
  --font-body: var(--font-hei);
  --font-num: "Barlow Condensed", "Bahnschrift", "DIN Alternate", "Arial Narrow", var(--font-hei);
  --display-weight: 900;
  --radius-sm: 1px; --radius-md: 2px; --radius-lg: 2px;
  --density: 1;
  --bg: #E7EAE8; --surface: #F2F4F3; --surface-2: #DCE1DE;
  --fg: #1D2B3A; --fg-muted: #4F5A66; --fg-subtle: #5B6672;
  --border: #C6CDD3; --border-strong: #7F8B97;
  --primary: #1F4E8C; --on-primary: #FFFFFF; --primary-soft: #D3DEEC;
  --accent: #B8322A; --on-accent: #FFFFFF;
  --success: #1F6B45; --warning: #8A5A00; --danger: #B8322A;
  --ring: #B8322A; --selection: #CFDCEC;
  --shadow: none;
  --hero-bg: #F2F4F3; --hero-line: #1D2B3A;
}
html[data-theme="blueprint"][data-mode="dark"] {

/* ---------- 基础层：浏览器自带的部分也要跟主题走 ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { color-scheme: light; -webkit-text-size-adjust: 100%; }
html[data-mode="dark"] { color-scheme: dark; }
@media (prefers-color-scheme: dark) { html:not([data-mode="light"]) { color-scheme: dark; } }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: var(--text-md);
  line-height: var(--leading-body);
  text-autospace: normal;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-weight: var(--display-weight, 700);
  line-height: var(--leading-tight);
  text-wrap: balance;
  margin: 0;
}
::selection { background: var(--selection); color: var(--fg); }
input, textarea, select, button { font: inherit; color: inherit; caret-color: var(--primary); }
:where(input[type="checkbox"], input[type="radio"], input[type="range"], progress) { accent-color: var(--primary); }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: var(--radius-sm); }
a { color: var(--primary); text-underline-offset: 0.2em; text-decoration-thickness: 1px; }
::placeholder { color: var(--fg-subtle); opacity: 1; }
* { scrollbar-color: var(--border-strong) transparent; scrollbar-width: thin; }
.num, time, td, .tabular { font-variant-numeric: tabular-nums; }
.icon { width: var(--icon-size); height: var(--icon-size); flex: none;
  fill: none; stroke: currentColor; stroke-width: var(--icon-stroke); stroke-linecap: round; stroke-linejoin: round; }
.icon-sm { --icon-size: 16px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}

<style>
/* ================= 工作台页面样式（只用主题变量） ================= */

/* 收支 */
.sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-3); margin-bottom: var(--space-4); }
.sum div { display: grid; gap: 2px; }
.sum b { font-size: var(--text-lg); font-family: var(--font-num, inherit); font-variant-numeric: tabular-nums; font-weight: 600; }
.amt { margin-left: auto; text-align: right; font-family: var(--font-num, inherit); font-variant-numeric: tabular-nums; white-space: nowrap; }
.neg { color: var(--negative, var(--danger)); }
.seg { display: inline-flex; padding: 2px; background: var(--surface-2); border-radius: var(--radius-md); }
.seg button { border: 0; background: transparent; padding: 4px 10px; min-height: 32px; border-radius: calc(var(--radius-md) - 2px); color: var(--fg-muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: var(--shadow); }

/* 计时 */
.timer { font-family: var(--font-mono); font-size: var(--text-2xl); font-variant-numeric: tabular-nums; line-height: 1.2; margin: var(--space-2) 0 var(--space-4); }
html[data-theme="nightdesk"] .timer { color: var(--accent); }
.focus-btn { display: none; }
html[data-theme="nightdesk"] .focus-btn, .focus-on .focus-btn { display: inline-grid; }
.focus-layer { position: fixed; inset: 0; background: var(--dim, rgba(0,0,0,0.5)); display: none; place-items: center; z-index: 40; padding: var(--gutter); }
.focus-layer.on { display: grid; animation: fade var(--dur) var(--ease-out); }
.focus-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-6); text-align: center; width: 100%; max-width: 440px; box-shadow: var(--shadow); }
.focus-card .timer { font-size: var(--text-3xl); }
@keyframes fade { from { opacity: 0; } }

/* 倒数日 */
.cd { white-space: nowrap; color: var(--fg-muted); font-size: var(--text-sm); }
.cd-days { font-family: var(--font-num, var(--font-display)); font-variant-numeric: tabular-nums; font-size: var(--text-lg); font-weight: 600; color: var(--fg); margin: 0 2px; }

/* 设置面板、提示条 */
.sheet { position: fixed; inset: 0; z-index: 60; display: none; background: rgba(0,0,0,0.32); }
.sheet.on { display: block; }
.sheet-card { position: absolute; top: 0; right: 0; height: 100%; width: min(360px, 100%); background: var(--surface); padding: var(--space-5); overflow: auto; box-shadow: var(--shadow); }
.sheet-card h2 { font-size: var(--text-lg); }
.sheet-card section { padding: var(--space-4) 0; border-top: 1px solid var(--border); }
.sheet-card h3 { font-size: var(--text-sm); color: var(--fg-muted); font-family: var(--font-body); margin: 0 0 var(--space-3); }
.theme-opts { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
.theme-opts button { text-align: left; padding: var(--space-2) var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg); min-height: 40px; }
.theme-opts button[aria-pressed="true"] { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); font-weight: 600; }
.stack { display: grid; gap: var(--space-2); }
.toast { position: fixed; left: 50%; bottom: var(--space-5); transform: translateX(-50%); z-index: 80; display: none; align-items: center; gap: var(--space-3); background: var(--fg); color: var(--bg); padding: var(--space-2) var(--space-2) var(--space-2) var(--space-4); border-radius: var(--radius-md); max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.toast.on { display: flex; }
.toast button { background: transparent; border: 0; color: inherit; font-weight: 700; padding: 6px 10px; text-decoration: underline; text-underline-offset: 0.2em; }
.banner { background: var(--primary-soft); color: var(--fg); padding: var(--space-2) var(--space-4); border-radius: var(--radius-md); margin-bottom: var(--space-4); font-size: var(--text-sm); }
.foot { margin-top: var(--space-7); color: var(--fg-subtle); font-size: var(--text-sm); }

/* ================= 主视觉（hero） ================= */
.mod-hero { padding: 0 !important; overflow: hidden; }
.hero { position: relative; display: grid; gap: var(--space-5); padding: var(--space-5); }
.hero-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--space-3); }
.hero-head h2 { font-size: var(--text-xl); margin: 0; }
.hero-sub { color: var(--fg-muted); margin: var(--space-1) 0 0; }
.hero-stage { position: relative; height: 460px; border-radius: var(--radius-lg); background: var(--hero-bg, var(--surface-2)); overflow: hidden; touch-action: pan-y; }
.hero-stage .persp { position: absolute; inset: 0; perspective: 1800px; }
.hero-scene { position: absolute; left: 50%; width: 0; height: 0; transform-style: preserve-3d; }
.hero-note { position: absolute; left: var(--space-4); right: var(--space-4); bottom: var(--space-3); margin: 0; font-size: var(--text-sm); color: var(--fg-muted); pointer-events: none; }
.p3d { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
.face { position: absolute; box-sizing: border-box; }
.hero-tabs { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.hero-tabs button { min-height: 40px; padding: 6px 14px; border-radius: var(--radius-md); border: 1.5px solid var(--border-strong); background: transparent; color: var(--fg); font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
.hero-tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.hero-tabs .n { font-family: var(--font-num, inherit); font-variant-numeric: tabular-nums; font-weight: 700; }
.hero-legend { display: flex; flex-wrap: wrap; gap: var(--space-4); font-size: var(--text-sm); color: var(--fg-muted); }
.hero-legend i { display: inline-block; width: 14px; height: 14px; margin-right: 6px; vertical-align: -2px; box-sizing: border-box; }
.hero-split { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: var(--space-5); align-items: center; }
@media (max-width: 860px) { .hero-split { grid-template-columns: minmax(0, 1fr); } .hero-stage { height: 380px; } .hero-scene { --s: 0.72; } }
.hero-scene { transform-origin: 0 0; }
@media (max-width: 640px) { .hero-parcels .hero-scene { --s: 0.46; } .hero-dossier .hero-stage { height: 300px !important; } .hero-vinyl .hero-stage { height: 320px; } }

/* 楼体 */
.tower-cur { animation: redline 2.4s ease-in-out infinite; }
@keyframes redline { 50% { opacity: 0.45; } }

/* 黑胶 */
.vinyl-wrap { position: relative; width: min(420px, 100%); aspect-ratio: 1; margin: 0 auto; perspective: 1400px; }
.vinyl-tilt { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateX(54deg) rotateZ(-14deg); }
.vinyl-shadow { position: absolute; left: 10%; top: 16%; width: 82%; height: 82%; border-radius: 50%; background: rgba(0,0,0,0.45); filter: blur(22px); transform: translateZ(-30px); }
.vinyl-flip { position: absolute; left: 6%; top: 6%; width: 88%; height: 88%; transform-style: preserve-3d; transition: transform 0.9s var(--ease-out); }
.vinyl-edge { position: absolute; inset: 0; border-radius: 50%; background: #0B0607; transform: translateZ(-5px); }
.vinyl-disc { position: absolute; inset: 0; border-radius: 50%; animation: spin 1.8s linear infinite; background: repeating-radial-gradient(circle at 50% 50%, #151012 0 1.2px, #22191C 1.2px 3px); box-shadow: inset 0 0 0 6px #0B0607; }
.vinyl-disc::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 20deg, rgba(255,255,255,0) 0deg, rgba(255,240,220,0.14) 40deg, rgba(255,255,255,0) 90deg, rgba(255,255,255,0) 180deg, rgba(255,240,220,0.10) 220deg, rgba(255,255,255,0) 270deg); }
.vinyl-paused .vinyl-disc { animation-play-state: paused; }
.vinyl-label { position: absolute; left: 33%; top: 33%; width: 34%; height: 34%; border-radius: 50%; display: grid; place-items: center; color: #1E0E10; }
.vinyl-label .hole { width: 24%; height: 24%; border-radius: 50%; background: #1E0E10; }
.vinyl-label .side { position: absolute; top: 14%; font-family: var(--font-latin, var(--font-display)); font-style: italic; font-size: 24px; }
.vinyl-label .who { position: absolute; bottom: 16%; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; }
.vinyl-arm { position: absolute; right: -2%; top: 0; width: 14px; height: 62%; transform-origin: 7px 7px; transition: transform 0.8s var(--ease-out); transform: translateZ(26px) rotate(24deg); }
.vinyl-paused .vinyl-arm { transform: translateZ(26px) rotate(4deg); }
.vinyl-arm::before { content: ""; position: absolute; left: -12px; top: -12px; width: 38px; height: 38px; border-radius: 50%; background: #C2A9A0; box-shadow: 0 0 0 6px #3A2124; }
.vinyl-arm::after { content: ""; position: absolute; left: 4px; top: 10px; width: 6px; height: 92%; border-radius: 3px; background: linear-gradient(90deg, #8E7A73, #E7DCD2, #8E7A73); }
.vinyl-arm b { position: absolute; left: -4px; bottom: -10px; width: 22px; height: 30px; border-radius: 3px; background: var(--label-a, var(--primary)); }
@keyframes spin { to { transform: rotate(360deg); } }
.tracks h3 { font-family: var(--font-latin, var(--font-display)); font-style: italic; font-weight: 400; font-size: var(--text-3xl); line-height: 1; margin: 0 0 var(--space-1); }
.track { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 2px var(--space-3); align-items: baseline; padding: var(--space-3) 0; border-top: 1px solid var(--border); }
.track .no { font-family: var(--font-latin, var(--font-num, inherit)); font-size: var(--text-xl); color: var(--fg-muted); line-height: 1; }
.track.next .no { color: var(--primary); }
.track.done { opacity: 0.6; }
.track.done .t { text-decoration: line-through; }
.track .t { font-weight: 700; }
.track time { font-family: var(--font-num, var(--font-mono)); font-size: var(--text-sm); }
.pill { display: inline-block; font-size: var(--text-xs); font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--primary); color: var(--on-primary); }

/* 卷宗 */
.dossier-btn { position: absolute; left: 0; top: 0; padding: 0; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; transform-style: preserve-3d; transition: transform 0.55s var(--ease-out); }
.dossier-btn .in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 0.35s var(--ease-out); }
.dossier-btn:hover .in { transform: translateZ(14px); }
.dossier-btn:focus-visible { outline: none; }
.dossier-btn:focus-visible .paper { box-shadow: 0 0 0 3px var(--ring); }
.dossier-btn .tab { position: absolute; left: 22px; top: -26px; width: 150px; height: 30px; border-radius: 6px 6px 0 0; display: flex; align-items: center; padding: 0 12px; box-sizing: border-box; color: var(--folder-ink, #26231D); font-size: 14px; font-weight: 700; }
.dossier-btn .paper { position: absolute; inset: 0; border-radius: 2px 6px 6px 6px; color: var(--folder-ink, #26231D); padding: 16px 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px; }
.dossier-btn .ttl { font-family: var(--font-song); font-weight: 700; font-size: 18px; }
.dossier-btn .shadow { position: absolute; left: 10px; top: 14px; width: 100%; height: 100%; background: rgba(0,0,0,0.35); filter: blur(10px); transform: translateZ(-2px); }
.flag { font-size: 12px; font-weight: 700; color: #FFFFFF; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
.big-days { display: flex; align-items: baseline; gap: var(--space-3); padding: var(--space-4); border: 1px solid var(--border); border-radius: var(--radius-md); }
.big-days b { font-family: var(--font-num, var(--font-display)); font-size: var(--text-3xl); line-height: 1; font-weight: 600; }

/* 积木 */
@keyframes drop { 0% { transform: translateY(-320px); opacity: 0; } 60% { transform: translateY(8px); opacity: 1; } 80% { transform: translateY(-6px); } 100% { transform: translateY(0); } }
.block-new { animation: drop 0.7s var(--ease-out) both; }

/* 货架 */
@keyframes bob { 50% { transform: translateY(-6px); } }
.bay-on .bob { animation: bob 2.4s ease-in-out infinite; }
.stepper { display: inline-flex; align-items: center; gap: var(--space-2); }
.stepper b { font-family: var(--font-num, inherit); font-size: var(--text-xl); min-width: 2.2em; text-align: center; font-variant-numeric: tabular-nums; }

/* 各主题的模块外观 */
html[data-theme="blueprint"] .area-main .mod { box-shadow: none; border: 1.5px solid var(--hero-line, var(--fg)); border-radius: 0; }
html[data-theme="blueprint"] .hero-stage { border-radius: 0; }
html:is([data-theme="vinyl"], [data-theme="chamber"]) .area-main .mod { background: transparent; box-shadow: none; border-radius: 0; padding: var(--space-4) 0 0; border-top: 1px solid var(--border); }
html:is([data-theme="vinyl"], [data-theme="chamber"]) .area-main .mod-hero { border-top: 0; }
html:is([data-theme="vinyl"], [data-theme="chamber"]) .area-main .hero { padding: 0 0 var(--space-5); }
html[data-theme="vinyl"] .hero-stage { background: radial-gradient(closest-side at 50% 46%, color-mix(in srgb, var(--primary) 16%, transparent), transparent 72%); }
html[data-theme="playroom"] .area-main .mod { border-radius: var(--radius-lg); box-shadow: none; }
html[data-theme="depot"] .area-main .mod { border-radius: var(--radius-lg); box-shadow: none; }
html[data-theme="depot"] .hero-tabs button { border-color: var(--fg); border-width: 2px; }

/* 列表末尾的“添加”入口 */
.add-row { display: inline-flex; align-items: center; gap: var(--space-2); min-height: 40px; margin-top: var(--space-2); padding: 0; border: 0; background: transparent; color: var(--primary); font-weight: 500; }
.add-row:hover { text-decoration: underline; text-underline-offset: 0.25em; }
.add-open { margin-top: var(--space-3); }
@media (prefers-reduced-motion: reduce) { .vinyl-disc, .tower-cur, .bay-on .bob, .block-new { animation: none !important; } .vinyl-flip, .vinyl-arm, .dossier-btn, .dossier-btn .in { transition: none !important; } }
</style>

              h('span', { style: { marginTop: 'auto', borderTop: '1px solid rgba(38,35,29,0.2)', paddingTop: '10px', display: 'flex', justifyContent: 'space-between', fontSize: '14px' } }, h('span', { text: c.next || '' }), h('span', { style: { fontWeight: '600' }, text: (c.date || '').slice(5).replace('-', '.') + (c.time ? ' ' + c.time : '') })))));
        scene.append(btn);
      });
      stage.append(scene);
      var s = C[d.sel], n = daysTo(s.date), urgent = s.urgent || (n != null && n <= 3);
      var detail = h('div', { class: 'stack', style: { gap: 'var(--space-4)' } },
        h('div', null, h('span', { class: 'meta', text: s.no || '' }), h('h3', { style: { fontSize: 'var(--text-xl)', margin: '4px 0' }, text: s.title || '' }), h('span', { class: 'meta', text: s.parties || '' })),
        n != null ? h('div', { class: 'big-days', style: { borderColor: urgent ? 'var(--danger)' : 'var(--border)' } }, h('b', { style: { color: urgent ? 'var(--danger)' : 'var(--primary)' }, text: n > 0 ? String(n) : n === 0 ? '今天' : String(-n) }), h('span', null, h('span', { style: { display: 'block' }, text: n > 0 ? '天后' + (s.next || '') : n === 0 ? s.next || '' : '天前已过：' + (s.next || '') }), h('span', { class: 'meta', text: (s.date || '') + (s.time ? ' ' + s.time : '') }))) : null,

  /* —— 积木塔：今天做完一件事，掉下一块积木 —— */
  HERO.blocks = function (m, box, d) {

          h('div', { class: 'persp', 'aria-hidden': 'true', style: { perspective: '2000px', perspectiveOrigin: '50% 40%' } }, scene),
          done.length ? null : h('p', { class: 'hero-note', style: { top: '45%', textAlign: 'center' }, text: '勾掉一件做完的事，这里就会掉下一块积木。' }))));
    }

  };

  /* —— 货架：订单按状态堆成包裹 —— */
  HERO.parcels = function (m, box, d) {
    var B = (m.bays && m.bays.length ? m.bays : [{ name: '待打包', kind: 'open' }, { name: '待揽收', kind: 'taped' }, { name: '已发出', kind: 'sent' }]).slice(0, 3);

      var tabs = h('div', { class: 'hero-tabs', role: 'tablist', 'aria-label': '按状态看' }, B.map(function (b, i) {
        return h('button', { type: 'button', role: 'tab', 'aria-selected': String(i === d.sel), onclick: function () { d.sel = i; persist(); draw(); } }, b.name, h('span', { class: 'n', text: String(d.counts[i]) }));
      }));

      B.forEach(function (b, i) {
        var on = i === d.sel, kind = b.kind || ['open', 'taped', 'sent'][i];

          h('div', { class: 'face', style: { width: '230px', height: '170px', left: '-115px', top: '-85px', transform: 'rotateX(90deg)', background: on ? 'var(--shelf-on, var(--primary))' : 'var(--shelf, var(--surface-2))', borderRadius: '6px', boxShadow: '0 0 0 3px ' + (on ? 'var(--shelf-on-edge, var(--primary))' : 'var(--shelf-edge, var(--border-strong))') } }),
          h('div', { class: 'face', style: { width: '230px', height: '16px', left: '-115px', top: '0', transform: 'translateZ(85px)', background: on ? 'var(--shelf-on-edge, var(--primary))' : 'var(--shelf-edge, var(--border-strong))' } }),
          h('div', { class: 'face', style: { width: '230px', height: '44px', left: '-115px', top: '22px', transform: 'translateZ(85px)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', color: 'var(--fg)', fontWeight: '900', fontSize: '18px' } }, h('span', { text: b.name }), h('span', { style: { fontFamily: 'var(--font-num, inherit)', fontSize: '26px' }, text: String(d.counts[i]) })));
        var n = Math.min(d.counts[i], 16);

          var tape = kind === 'open' ? null : h('span', { style: { display: 'block', width: '10px', height: '100%', margin: '0 auto', background: '#EA580C' } });
          var tag = h('span', { style: { display: 'block', width: '16px', height: '10px', margin: '12px auto 0', background: kind === 'sent' ? '#2D5BD0' : '#F3EBDD', borderRadius: '1px' } });
          bay.append(h('div', { class: 'p3d', style: { transform: 'translate3d(' + (-78 + col * 52) + 'px,' + (-17 - layer * 34) + 'px,' + (-26 + row * 56) + 'px) rotateY(' + (k % 5 === 2 ? 6 : k % 5 === 4 ? -5 : 0) + 'deg)' } },
            h('div', { class: 'p3d bob', style: { animationDelay: (k * 0.15).toFixed(2) + 's' } }, cuboid(44, 34, 44, { front: '#C9A476', back: '#C9A476', side: '#A9875A', top: kind === 'open' ? '#DDBF93' : '#D3B183', label: tag, topInner: tape }))));

      var moveNext = d.sel < B.length - 1 && d.counts[d.sel] > 0 ? h('button', { class: 'btn', type: 'button', onclick: function () { d.counts[d.sel]--; d.counts[d.sel + 1]++; persist(); draw(); } }, '挪一单到“' + B[d.sel + 1].name + '”') : null;
      var orders = (b.orders || []).map(function (o) { return h('li', null, h('span', { class: 'grow' }, h('b', { text: o.who || '' }), h('span', { class: 'meta', style: { display: 'block' }, text: [o.item, o.city].filter(Boolean).join('，') })), h('span', { class: 'amt', text: o.amt || '' })); });
      box.append(h('div', { class: 'hero' },

        h('div', { class: 'hero-stage', style: { height: '420px' } }, h('div', { class: 'persp', 'aria-hidden': 'true', style: { perspective: '2200px', perspectiveOrigin: '50% 25%' } }, scene),
          h('p', { class: 'hero-note', text: '没封口的是还没打包的，贴橙色胶带的等快递来收，贴蓝标的已经发出。' })),
        h('div', { class: 'row', style: { flexWrap: 'wrap', justifyContent: 'space-between' } }, step, moveNext),
        orders.length ? h('ul', { class: 'list' }, orders) : null));

  R.hero = function (m, box) {
    box.classList.add('mod-hero', 'hero-' + (HERO[m.style] ? m.style : 'blocks'));
    var d = D(m), fn = HERO[m.style] || HERO.blocks;
    fn(m, box, d);
  };

  /* ---------- 专注模式 ---------- */
  var fTick = null, fLeft = 0, fPaused = false;
  var layer = document.getElementById('focus');
  function fShow() { document.getElementById('focus-timer').textContent = pad(Math.floor(fLeft / 60)) + ':' + pad(fLeft % 60); }
  function startFocus(text) {
    document.getElementById('focus-title').textContent = text;
    fLeft = (CONFIG.focusMinutes || 25) * 60; fPaused = false; fShow(); clearInterval(fTick);
    fTick = setInterval(function () { if (fPaused) return; fLeft = Math.max(0, fLeft - 1); fShow(); if (!fLeft) { clearInterval(fTick); toast('专注时间到了'); } }, 1000);
    document.getElementById('focus-pause').textContent = '暂停';
    layer.classList.add('on'); document.getElementById('focus-exit').focus();
  }
  function stopFocus() { layer.classList.remove('on'); clearInterval(fTick); }

  if (CONFIG.focusMode) html.classList.add('focus-on');

  /* ---------- 复制 ---------- */
  function copy(text, msg) {

    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
    function fallback() { var t = h('textarea', { style: { position: 'fixed', opacity: '0' } }); t.value = text; document.body.append(t); t.select(); try { document.execCommand('copy'); ok(); } catch (e) { toast('复制没有成功，请手动选中文字复制'); } t.remove(); }
  }

  /* ---------- 组装 ---------- */
  function renderAll() {
    var areas = { top: document.getElementById('area-top'), main: document.getElementById('area-main'), side: document.getElementById('area-side') };
    watchers = [];
    Object.keys(areas).forEach(function (k) { areas[k].innerHTML = ''; });
    var layout = CONFIG.layout || 'grid';
    document.getElementById('layout').className = 'layout layout-' + layout;

  [['auto', '跟随系统'], ['light', '浅色'], ['dark', '深色']].forEach(function (o) { document.getElementById('mode-opts').append(h('button', { type: 'button', 'data-v': o[0], onclick: function () { prefs.mode = o[0]; save(PREF, prefs); applyTheme(); }, text: o[1] })); });

  document.getElementById('export').onclick = function () {

  };
  document.getElementById('import-file').onchange = function () {
    var f = this.files[0]; if (!f) return; var r = new FileReader();

      } catch (e) { toast('这个文件不是工作台导出的数据，没有导入'); }
    };

  };
  document.getElementById('reset').onclick = function () {
    if (!confirm('恢复后，你添加和修改过的内容都会被清空，回到最初的样子。确定吗？建议先导出数据。')) return;
    var old = state; state = { version: 1, data: {} }; modules.forEach(function (m) { state.data[m.key] = seed(m); }); save(KEY, state); renderAll(); closeSheet();

  // 过了零点自动刷新日期和日程

})();
